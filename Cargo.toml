[package]
name = "tide"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Harry Fleming"]
license = "MIT OR Apache-2.0"
description = "One-shot dotfile sync CLI — copy, commit, and push watched dotfiles to your own git repo"
homepage = "https://github.com/dairycow/tide"
repository = "https://github.com/dairycow/tide"
readme = "README.md"
keywords = ["dotfiles", "dotfile", "cli", "sync", "git"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
